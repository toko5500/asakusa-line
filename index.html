<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>都営浅草線 リアルタイム在線位置</title>
<style>
:root{--bg:#131314;--hd:rgba(24,25,27,.94);--sf:#1E1F20;--cd:#28292C;--cdt:#2F1E28;--bd:#3C4043;--bds:#5F6368;--tx:#E8EAED;--txs:#9AA0A6;--txm:#80868B;--rose:#E85298;--roseb:#F472B6;--rosed:#BE185D;--glow:rgba(232,82,152,.35);--red:#F87171;--rbg:rgba(220,38,38,.2);--rbd:rgba(248,113,113,.5);--cyan:#67E8F9;--yel:#FDE047;--ybg:rgba(234,179,8,.16);--ybd:rgba(250,204,21,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased;color-scheme:dark}
.app-header{position:sticky;top:0;z-index:50;background:var(--hd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top)}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:8px 8px;gap:4px}
.title-group{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.line-symbol{width:24px;height:24px;border-radius:50%;border:3px solid var(--rose);background:var(--sf);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0}
.title-texts{min-width:0;overflow:hidden}
.app-title{margin:0;font-size:13.5px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:3px;white-space:nowrap}
.rev-tag{font-size:8.5px;font-weight:600;color:var(--txs);letter-spacing:-.04em;white-space:nowrap}
.train-count-pill{font-size:9.5px;font-weight:700;background:rgba(232,82,152,.18);color:var(--roseb);border:1px solid rgba(232,82,152,.45);padding:1px 5px;border-radius:999px;flex-shrink:0}
.last-updated{font-size:10px;color:var(--txs);margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.header-inline-legend{display:none}
.header-controls{display:flex;align-items:center;gap:5px;flex-shrink:0}
.layout-btn{appearance:none;border:1px solid var(--bds);background:var(--cd);color:var(--tx);font-size:10.5px;font-weight:700;padding:5px 7px;min-height:32px;border-radius:8px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.auto-toggle{display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;user-select:none}
.toggle-label-text{font-size:8.5px;font-weight:600;color:var(--txs);font-variant-numeric:tabular-nums}
.toggle-switch{position:relative;width:34px;height:18px;background:#3C4043;border-radius:999px;transition:background-color .2s}
.toggle-switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--tx);border-radius:50%;transition:transform .2s}
.auto-toggle input{position:absolute;opacity:0;width:0;height:0}
.auto-toggle input:checked+.toggle-switch{background:var(--rose)}
.auto-toggle input:checked+.toggle-switch::after{transform:translateX(16px);background:#fff}
.refresh-btn{appearance:none;border:none;background:var(--rose);color:#fff;font-size:11.5px;font-weight:700;padding:6px 9px;min-height:32px;border-radius:8px;display:inline-flex;align-items:center;gap:3px;cursor:pointer;box-shadow:0 2px 8px var(--glow);touch-action:manipulation}
.refresh-btn:active{transform:scale(.96);background:var(--rosed)}
.refresh-btn:disabled{opacity:.65}
.refresh-icon{width:12px;height:12px}
.is-loading .refresh-icon{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.direction-bar{display:grid;grid-template-columns:1fr 82px 1fr;align-items:center;background:var(--sf);border-top:1px solid var(--bd);padding:5px 4px;font-size:11px;font-weight:700;text-align:center}
.dir-south{color:#8AB4F8}.dir-center{color:var(--roseb);font-size:10px}.dir-north{color:var(--roseb)}
.status-banner{margin:10px 10px 0;padding:10px 12px;border-radius:12px;font-size:13px;display:none;align-items:center;justify-content:space-between;gap:10px}
.status-banner.error{display:flex;background:rgba(220,38,38,.16);border:1px solid var(--rbd);color:#FCA5A5}
.retry-link{background:#EF4444;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
.main-container{max-width:640px;margin:0 auto;padding:6px 4px 24px}
.route-cap{display:flex;justify-content:center;padding:6px 0}
.route-cap-badge{font-size:11px;font-weight:700;color:var(--txs);background:var(--sf);border:1px solid var(--bd);padding:3px 12px;border-radius:999px}
.route-map{position:relative;display:flex;flex-direction:column}
.route-column{display:contents}
.col-header,.col-continue-badge{display:none}
.station-row,.segment-row{display:grid;grid-template-columns:1fr 82px 1fr;align-items:stretch;position:relative}
.station-row{min-height:52px}.station-row.is-double-track{min-height:78px;padding:3px 0}
.segment-row{min-height:20px}.segment-row.has-trains{min-height:58px;padding:4px 0}
.track-col{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:3px 4px;min-width:0}
.track-col.left{align-items:flex-end}.track-col.right{align-items:flex-start}
.bay-guide{font-size:8.5px;font-weight:700;color:var(--txs);line-height:1;padding:0 2px;opacity:.85}
.empty-bay-slot{width:100%;height:22px;border:1px dashed var(--bd);border-radius:7px;background:rgba(30,31,32,.5);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;color:#747980}
.empty-bay-slot.siding{border-color:#4B5563;color:#8B929A;background:rgba(20,22,26,.65)}
.center-col{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.center-col::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:6px;transform:translateX(-50%);background:var(--rose);z-index:1}
.station-row.first-station .center-col::before{top:50%}
.station-row.last-station .center-col::before{bottom:50%}
.station-row.is-double-track .center-col::after{content:"";position:absolute;top:4px;bottom:4px;left:50%;width:24px;transform:translateX(-50%);border-left:2.5px solid var(--rose);border-right:2.5px solid var(--rose);border-radius:8px;opacity:.7;z-index:1;pointer-events:none}
.station-row.first-station.is-double-track .center-col::after{top:50%}
.station-row.last-station.is-double-track .center-col::after{bottom:50%}
.station-node{position:relative;z-index:2;background:var(--sf);border:2px solid var(--rose);border-radius:10px;padding:5px 4px;width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.station-row.is-double-track .station-node{border-width:2.5px;box-shadow:0 0 10px rgba(232,82,152,.25)}
.st-name{font-size:12px;font-weight:700;color:var(--tx);text-align:center;white-space:nowrap;letter-spacing:-.02em}
.st-name.is-long{font-size:11px;letter-spacing:-.04em}
.st-note{font-size:8px;font-weight:700;color:var(--roseb);margin-top:2px;line-height:1.1;text-align:center}
.segment-dot{position:relative;z-index:2;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2.5px solid var(--rose);opacity:0}
.segment-row.has-trains .segment-dot{opacity:1}
.train-badge{appearance:none;text-align:left;font-family:inherit;width:100%;background:var(--cd);border:1.5px solid var(--bds);border-radius:10px;padding:5px 7px;box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer;display:flex;flex-direction:column;gap:3px;position:relative;touch-action:manipulation}
.train-badge:active{transform:scale(.97)}
.train-badge.is-stopped{border-style:solid}.train-badge.is-running{border-style:dashed}
.train-badge.is-other{border-color:#6E747C}.train-badge.is-other.is-running{border-color:var(--txs)}
.train-badge.is-toei{background:var(--cdt);border-width:2.5px;border-color:var(--rose);box-shadow:0 0 0 1px rgba(232,82,152,.28),0 0 12px var(--glow)}
.train-badge.is-siding{border-style:dotted;border-color:#F59E0B;background:#24211A}
.train-badge.is-siding.is-toei{border-color:var(--rose);background:#2C1E25}
.train-badge.is-pre{border-style:dotted;border-color:#38BDF8;background:#1A242B;opacity:.92}
.train-badge.is-pre.is-toei{border-color:var(--rose);background:var(--cdt);opacity:.95}
.track-col.left .train-badge::after,.track-col.right .train-badge::before{content:"";position:absolute;top:50%;width:5px;height:2px;background:#6E747C}
.track-col.left .train-badge.is-toei::after,.track-col.right .train-badge.is-toei::before{background:var(--rose);height:2.5px}
.track-col.left .train-badge::after{right:-6px}.track-col.right .train-badge::before{left:-6px}
.badge-row-top{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.train-type-chip{font-size:10px;font-weight:800;color:#fff;padding:1.5px 5px;border-radius:4px;white-space:nowrap;line-height:1.2}
.train-num-badge{font-size:10.5px;font-weight:900;color:#000;background:#E8EAED;border:1px solid #000;padding:.5px 5px;border-radius:4px;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.type-local{background:#4B5563}.type-express{background:#2563EB}.type-limited{background:#DC2626}.type-rapid{background:#16A34A}
.type-airport{background:#EA580C}.type-access{background:#9333EA}.type-commuter{background:#D97706}.type-liner{background:#0F172A;border:1px solid #64748B}.type-unknown{background:#5F6368}
.badge-row-mid{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:2px 4px;font-size:12px;font-weight:700;color:var(--tx);line-height:1.25}
.dest-wrap{display:flex;align-items:flex-start;gap:2px;min-width:68px;flex:1 1 auto}
.dir-arrow{font-size:11.5px;font-weight:900;flex-shrink:0;margin-top:1px}
.dir-arrow.north{color:var(--roseb)}.dir-arrow.south{color:#8AB4F8}
.dest-name{white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.eta-group{display:flex;align-items:center;flex-wrap:wrap;gap:2px;flex-shrink:0}
.nishi-eta{font-size:10px;font-weight:800;color:var(--cyan);background:rgba(103,232,249,.12);border:1px solid rgba(103,232,249,.35);padding:1px 4px;border-radius:4px;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.nishi-eta.none{color:var(--txm);background:rgba(128,134,139,.12);border-color:rgba(128,134,139,.3)}
.dep-eta{font-size:10px;font-weight:800;color:var(--yel);background:var(--ybg);border:1px solid var(--ybd);padding:1px 4px;border-radius:4px;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.badge-row-bottom{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:9.5px;color:var(--txs)}
.status-chips{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.state-label{font-weight:600}.state-label.running{color:var(--roseb)}.state-label.siding{color:#FBBF24}.state-label.pre{color:#38BDF8}
.toei-owner-chip{font-size:9px;font-weight:800;color:var(--roseb);background:rgba(232,82,152,.18);padding:0 4px;border-radius:3px}
.track-num-chip{font-size:9px;font-weight:800;color:#E8EAED;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:0 4px;border-radius:3px}
.delay-tag{font-size:10px;font-weight:800;color:var(--red);background:var(--rbg);border:1px solid var(--rbd);padding:0 4px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty-state-card{margin:12px 6px;padding:18px 16px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;text-align:center;color:var(--txs)}
.empty-state-title{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:6px}
.empty-state-desc{font-size:12.5px;margin:0}
.legend-box{margin:16px 4px 8px;padding:10px 12px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;font-size:11px;color:var(--txs);display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-sample-stop{width:15px;height:11px;border:1.5px solid var(--txs);border-radius:3px;background:var(--cd)}
.legend-sample-run{width:15px;height:11px;border:1.5px dashed var(--txs);border-radius:3px;background:var(--cd)}
.legend-sample-toei{width:15px;height:11px;border:2px solid var(--rose);border-radius:3px;background:var(--cdt);box-shadow:0 0 6px var(--glow)}
.app-footer{max-width:640px;margin:0 auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));font-size:10.5px;color:var(--txm);line-height:1.5;text-align:center}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.modal-backdrop.open{display:flex}
@media(min-width:520px){.modal-backdrop{align-items:center}}
.modal-sheet{width:100%;max-width:440px;background:var(--sf);border:1px solid var(--bd);border-radius:18px;box-shadow:0 12px 32px rgba(0,0,0,.65);overflow:hidden}
.modal-header{background:var(--rose);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.modal-title{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.modal-close{appearance:none;border:none;background:rgba(0,0,0,.25);color:#fff;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:14px 16px 18px}
.detail-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.detail-item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--bd);font-size:13.5px}
.detail-item:last-child{border-bottom:none;padding-bottom:0}
.detail-label{color:var(--txs);font-weight:600;flex-shrink:0}
.detail-value{color:var(--tx);font-weight:700;text-align:right;word-break:break-word}
.detail-value.delay-highlight{color:var(--red)}
.owner-pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;background:var(--cd);border:1px solid var(--bd)}
.owner-pill.toei{border-color:var(--rose);color:var(--roseb);background:rgba(232,82,152,.15)}
.siding-clear-btn{margin-top:12px;width:100%;appearance:none;border:1px solid #F59E0B;background:rgba(245,158,11,.15);color:#FBBF24;font-size:13px;font-weight:700;padding:9px;border-radius:10px;cursor:pointer}

body.is-3col{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body.is-3col .app-header{position:static;flex-shrink:0}
body.is-3col .header-top{padding:5px 12px}
body.is-3col .direction-bar,body.is-3col .route-cap,body.is-3col .legend-box{display:none}
body.is-3col .header-inline-legend{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--txs)}
body.is-3col .main-container{max-width:none;width:100%;flex:1;min-height:0;padding:4px 6px 3px;display:flex;flex-direction:column}
body.is-3col .empty-state-card{margin:0 0 6px;padding:8px 12px}
body.is-3col .route-map{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
body.is-3col .route-column{display:flex;flex-direction:column;justify-content:space-between;background:rgba(30,31,32,.45);border:1px solid #2A2B2E;border-radius:10px;padding:3px 3px 4px;min-height:0;overflow-y:auto}
body.is-3col .col-header{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;text-align:center;font-size:9.5px;font-weight:700;padding:2px 2px 3px;border-bottom:1px solid #2D2E32;margin-bottom:2px;flex-shrink:0}
body.is-3col .col-header-center{color:var(--txs);font-size:9px}
body.is-3col .col-continue-badge{display:flex;justify-content:center;font-size:8.5px;font-weight:700;color:var(--txm);padding:1px 0;flex-shrink:0}
body.is-3col .station-row,body.is-3col .segment-row{grid-template-columns:1fr 64px 1fr}
body.is-3col .station-row{min-height:30px}
body.is-3col .station-row.is-double-track{min-height:46px;padding:1px 0}
body.is-3col .segment-row{min-height:5px}
body.is-3col .segment-row.has-trains{min-height:36px;padding:2px 0}
body.is-3col .route-column .segment-row.col-tail-segment:not(.has-trains){display:none}
body.is-3col .track-col{padding:1px 2px;gap:2px}
body.is-3col .bay-guide{font-size:7.5px}
body.is-3col .station-node{width:60px;padding:2px;border-radius:7px}
body.is-3col .st-name{font-size:10.5px}
body.is-3col .st-name.is-long{font-size:9px}
body.is-3col .st-note{font-size:7px;margin-top:1px}
body.is-3col .empty-bay-slot{height:15px;font-size:7.5px;border-radius:5px}
body.is-3col .train-badge{padding:2px 4px;gap:1.5px;border-radius:6px}
body.is-3col .badge-row-top{gap:2.5px}
body.is-3col .train-type-chip{font-size:8.5px;padding:1px 3.5px}
body.is-3col .train-num-badge{font-size:9px;padding:0 3.5px}
body.is-3col .badge-row-mid{font-size:10.5px;line-height:1.15}
body.is-3col .dir-arrow{font-size:10px}
body.is-3col .nishi-eta,body.is-3col .dep-eta{font-size:8.5px;padding:0 3px}
body.is-3col .badge-row-bottom{font-size:8px}
body.is-3col .toei-owner-chip,body.is-3col .track-num-chip{font-size:7.5px}
body.is-3col .delay-tag{font-size:8.5px}
body.is-3col .app-footer{max-width:none;width:100%;flex-shrink:0;padding:2px 12px calc(3px + env(safe-area-inset-bottom));font-size:9px;display:flex;justify-content:center;gap:12px;white-space:nowrap;overflow:hidden}
body.is-3col .app-footer p{margin:0!important;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-top">
    <div class="title-group">
      <div class="line-symbol">A</div>
      <div class="title-texts">
        <h1 class="app-title"><span>都営浅草線</span><span class="rev-tag">2026年11月改正</span><span class="train-count-pill" id="trainCountPill">--本</span></h1>
        <div class="last-updated" id="lastUpdated">取得中...</div>
      </div>
    </div>
    <div class="header-inline-legend">
      <div class="legend-item"><span class="legend-sample-stop"></span><span>停車</span></div>
      <div class="legend-item"><span class="legend-sample-run"></span><span>走行</span></div>
      <div class="legend-item"><span class="legend-sample-toei"></span><span>都営車</span></div>
      <div class="legend-item"><span style="color:var(--cyan);font-weight:700">西 HH:MM</span><span>西馬込着</span></div>
      <div class="legend-item"><span style="color:var(--yel);font-weight:700">西/押 HH:MM発</span><span>発車</span></div>
    </div>
    <div class="header-controls">
      <button type="button" class="layout-btn" id="layoutToggleBtn">3列</button>
      <label class="auto-toggle"><input type="checkbox" id="autoRefreshToggle" checked><span class="toggle-switch"></span><span class="toggle-label-text" id="countdownText">自動 45s</span></label>
      <button type="button" class="refresh-btn" id="manualRefreshBtn">
        <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        <span>更新</span>
      </button>
    </div>
  </div>
  <div class="direction-bar">
    <div class="dir-south">↑ 西馬込・泉岳寺方面</div>
    <div class="dir-center">駅・路線</div>
    <div class="dir-north">↓ 押上・京成方面</div>
  </div>
</header>
<div id="statusBanner" class="status-banner" role="alert"><span id="statusBannerMsg"></span><button type="button" class="retry-link" id="retryBtn">再試行</button></div>
<main class="main-container">
  <div id="emptyStateContainer"></div>
  <div class="route-cap"><span class="route-cap-badge">▲ 西馬込（始点）</span></div>
  <div id="routeMap" class="route-map"></div>
  <div class="route-cap"><span class="route-cap-badge">▼ 京成押上線・北総線 直通方面</span></div>

      const dirStr=tt["odpt:railDirection"]||"";
      if(sd&&dirStr.includes("Southbound")&&hasSt(orig,"Sengakuji")){
        const dst=tt["odpt:destinationStation"],k=cn+"_"+sd;
        if(!sengaMap.has(k))sengaMap.set(k,{num,depTime:sd,depMin:toSvcMin(sd),trainType:tt["odpt:trainType"],dest:dst,origin:orig,targetTrack:hasSt(dst,"NishiMagome")?2:1});
      }
    });
  }

  function ingestStationTimetableArray(arr,cal,mode,sengaMap){
    arr.forEach(stObj=>{
      const calId=stObj["odpt:calendar"]||"",dirStr=stObj["odpt:railDirection"]||"";
      if(!calId.includes(cal))return;
      const list=Array.isArray(stObj["odpt:stationTimetableObject"])?stObj["odpt:stationTimetableObject"]:[];
      list.forEach(o=>{
        const dep=o["odpt:departureTime"],num=o["odpt:trainNumber"]||"";
        if(!dep||!num)return;
        const cn=coreNum(num),op=opCode(num);
        if(mode==="senga"&&dirStr.includes("Southbound")&&o["odpt:isOrigin"]){
          const k=cn+"_"+dep;
          if(!sengaMap.has(k)){
            const dst=o["odpt:destinationStation"];
            sengaMap.set(k,{num,depTime:dep,depMin:toSvcMin(dep),trainType:o["odpt:trainType"],dest:dst,origin:[SENGA_ID],targetTrack:hasSt(dst,"NishiMagome")?2:1});
          }
        }else if(mode==="nishi"&&dirStr.includes("Northbound")){
          addDepOp(nishiDepByOp,op,num,dep);
          const dm=toSvcMin(dep);
          if(!ttByNum.has(num))ttByNum.set(num,{num,origin:[NISHI_ID],na:null,nm:null,nd:dep,ndm:dm,od:null,odm:null});
          else if(!ttByNum.get(num).nd){ttByNum.get(num).nd=dep;ttByNum.get(num).ndm=dm}
          if(cn&&!ttByCore.has(cn))ttByCore.set(cn,[{num,origin:[NISHI_ID],na:null,nm:null,nd:dep,ndm:dm,od:null,odm:null}]);
        }else if(mode==="oshi"&&dirStr.includes("Southbound")){
          addDepOp(oshiDepByOp,op,num,dep);
          const dm=toSvcMin(dep);
          if(!ttByNum.has(num))ttByNum.set(num,{num,origin:null,na:null,nm:null,nd:null,ndm:null,od:dep,odm:dm});
          else if(!ttByNum.get(num).od){ttByNum.get(num).od=dep;ttByNum.get(num).odm=dm}
          if(cn&&!ttByCore.has(cn))ttByCore.set(cn,[{num,origin:null,na:null,nm:null,nd:null,ndm:null,od:dep,odm:dm}]);
        }
      });
    });
  }

  function finalizeTT(sengaMap){
    nishiByOp.forEach(l=>l.sort((a,b)=>a.min-b.min));
    nishiDepByOp.forEach(l=>l.sort((a,b)=>a.min-b.min));
    oshiDepByOp.forEach(l=>l.sort((a,b)=>a.min-b.min));
    sengaOrigins=Array.from(sengaMap.values()).sort((a,b)=>a.depMin-b.depMin);
  }

  async function safeFetchJson(url){
    try{
      const r=await fetch(url,{headers:{Accept:"application/json"}});
      if(!r.ok)return null;
      const d=await r.json();
      return Array.isArray(d)?d:null;
    }catch(e){return null}
  }

  async function loadTT(cal){
    if(ttLoading)return false;
    ttLoading=true;
    const sengaMap=new Map();
    buildManualSenga(cal,sengaMap);
    sengaOrigins=Array.from(sengaMap.values()).sort((a,b)=>a.depMin-b.depMin);

    const cKey=svcDateKey(cal);
    try{
      const cached=JSON.parse(localStorage.getItem(TT_CACHE_KEY)||"null");
      if(cached&&cached.key===cKey&&(Date.now()-(cached.savedAt||0)<14400000)&&Array.isArray(cached.recs)&&cached.recs.length>50){
        ttByNum.clear();ttByCore.clear();nishiByOp.clear();nishiDepByOp.clear();oshiDepByOp.clear();
        cached.recs.forEach(rec=>{
          ttByNum.set(rec.num,rec);
          const cn=coreNum(rec.num);
          if(cn){if(!ttByCore.has(cn))ttByCore.set(cn,[]);ttByCore.get(cn).push(rec)}
          const op=opCode(rec.num);
          if(op){
            if(rec.na){if(!nishiByOp.has(op))nishiByOp.set(op,[]);nishiByOp.get(op).push({num:rec.num,time:rec.na,min:rec.nm})}
            if(rec.nd)addDepOp(nishiDepByOp,op,rec.num,rec.nd);
            if(rec.od)addDepOp(oshiDepByOp,op,rec.num,rec.od);
          }
        });
        if(Array.isArray(cached.senga))cached.senga.forEach(x=>{const k=coreNum(x.num)+"_"+x.depTime;if(!sengaMap.has(k))sengaMap.set(k,x)});
        finalizeTT(sengaMap);
        ttReady=true;ttLoading=false;
        return true;
      }
    }catch(e){}

    try{
      const mainArr=await safeFetchJson(TT_BASE+cal);
      if(!mainArr||mainArr.length===0){ttLoading=false;return false}

      ttByNum.clear();ttByCore.clear();nishiByOp.clear();nishiDepByOp.clear();oshiDepByOp.clear();
      ingestTrainTimetableArray(mainArr,sengaMap);

      if(mainArr.length>=999){
        await sleep(250);
        const sb=await safeFetchJson(TT_BASE+cal+"&odpt:railDirection=odpt.RailDirection:Southbound");
        if(sb)ingestTrainTimetableArray(sb,sengaMap);
        await sleep(250);
        const nb=await safeFetchJson(TT_BASE+cal+"&odpt:railDirection=odpt.RailDirection:Northbound");
        if(nb)ingestTrainTimetableArray(nb,sengaMap);
      }

      await sleep(200);
      const stS=await safeFetchJson(ST_TT_BASE+"Sengakuji");
      if(stS)ingestStationTimetableArray(stS,cal,"senga",sengaMap);

      await sleep(200);
      const stN=await safeFetchJson(ST_TT_BASE+"NishiMagome");
      if(stN)ingestStationTimetableArray(stN,cal,"nishi",sengaMap);

      await sleep(200);
      const stO=await safeFetchJson(ST_TT_BASE+"Oshiage");
      if(stO)ingestStationTimetableArray(stO,cal,"oshi",sengaMap);

      finalizeTT(sengaMap);
      ttReady=true;

      try{
        const recs=Array.from(ttByNum.values());
        if(recs.length>50){
          localStorage.setItem(TT_CACHE_KEY,JSON.stringify({
            key:cKey,savedAt:Date.now(),recs,senga:Array.from(sengaMap.values()).filter(x=>!x.isManual)
          }));
        }
      }catch(e){}

      return true;
    }catch(e){return false}
    finally{ttLoading=false}
  }

  function findTT(num){
    if(!num)return null;
    if(ttByNum.has(num))return ttByNum.get(num);
    const list=ttByCore.get(coreNum(num));
    return(list&&list.length)?list[0]:null;
  }

  function nextNishi(t){
    if(!ttReady)return{text:"...",train:null,none:true};
    const num=t["odpt:trainNumber"]||"",nowM=nowSvcMin(),cn=coreNum(num);
    const destIsNishi=hasSt(t["odpt:destinationStation"],"NishiMagome");
    const dir=dirOf(t);

    // リアルタイムの行先が西馬込行きのときのみ「この列車自身の西馬込着」を採用
    if(destIsNishi){
      const cur=findTT(num);
      if(cur&&cur.na&&cur.nm>=nowM-45)return{text:cur.na,train:cur.num||num,none:false};
    }

    // 別運用(折り返し便)の西馬込着を探す。現在列車と同じ番号や、京急直通等からの非現実的な近接時刻は除外
    const op=opCode(num);
    if(op&&nishiByOp.has(op)){
      const minGap=(dir==="south"&&!destIsNishi)?25:(destIsNishi?-3:15);
      const hit=nishiByOp.get(op).find(x=>x.min>=nowM+minGap&&(destIsNishi||coreNum(x.num)!==cn));
      if(hit)return{text:hit.time,train:hit.num,none:false};
    }
    return{text:"-",train:null,none:true};
  }

  function stDeparture(t,which,dir){
    if(!ttReady)return null;
    const num=t["odpt:trainNumber"]||"",nowM=nowSvcMin();
    const cur=ttByNum.get(num);
    if(which==="nishi"&&cur&&cur.nd)return{time:cur.nd,train:num};
    if(which==="oshi"&&cur&&cur.od)return{time:cur.od,train:num};

    const coreList=ttByCore.get(coreNum(num));
    if(coreList){
      const match=coreList.find(x=>which==="nishi"?x.nd:x.od);
      if(match)return{time:which==="nishi"?match.nd:match.od,train:match.num};
    }

    const op=opCode(num),map=which==="nishi"?nishiDepByOp:oshiDepByOp;
    if(op&&map.has(op)){
      const list=map.get(op);
      const isDepartingDir=(which==="nishi"&&dir==="north")||(which==="oshi"&&dir==="south");
      const future=list.find(x=>x.min>=nowM-5&&x.min<=nowM+50);
      if(future)return{time:future.time,train:future.num};
      if(isDepartingDir){
        const delayed=[...list].reverse().find(x=>x.min>=nowM-25&&x.min<nowM-5);
        if(delayed)return{time:delayed.time,train:delayed.num};
      }
    }
    return null;
  }

  function originOf(t){
    if(t["odpt:originStation"]&&t["odpt:originStation"].length)return t["odpt:originStation"];
    if(t["odpt:startingStation"]&&t["odpt:startingStation"].length)return t["odpt:startingStation"];
    const c=findTT(t["odpt:trainNumber"]||"");return c?c.origin:null;
  }

  function sengaTrack(t,dir){
    if(dir==="south")return hasSt(t["odpt:destinationStation"],"NishiMagome")?2:1;
    return hasSt(originOf(t),"NishiMagome")?3:4;
  }

  function dirOf(t){
    const d=t["odpt:railDirection"]||"";
    if(d.includes("Northbound"))return"north";if(d.includes("Southbound"))return"south";
    const fi=IDX.get(t["odpt:fromStation"]),ti=IDX.get(t["odpt:toStation"]);
    return(fi!==undefined&&ti!==undefined)?(ti>fi?"north":"south"):"north";
  }

  function updateSidings(currTrains){
    const now=Date.now();
    sidings.sengakuji=sidings.sengakuji.filter(s=>now-s.enteredAt<3600000);
    sidings.asakusabashi=sidings.asakusabashi.filter(s=>now-s.enteredAt<3600000);

    const currCores=new Set(),southCores=new Set(),southOps=new Set();
    currTrains.forEach(t=>{
      const num=t["odpt:trainNumber"]||"";
      if(num)currCores.add(coreNum(num));
      if(dirOf(t)==="south"&&num){
        southCores.add(coreNum(num));
        const op=opCode(num);if(op)southOps.add(op);
      }
    });

    const shouldKeep=s=>{
      if(sidingMatchesSouth(s.origNum,southCores))return false;
      const op=opCode(s.origNum);if(op&&southOps.has(op))return false;
      return true;
    };
    sidings.sengakuji=sidings.sengakuji.filter(shouldKeep);
    sidings.asakusabashi=sidings.asakusabashi.filter(shouldKeep);

    if(hasPrevSnap){
      prevTrainMap.forEach((prev,cNum)=>{
        if(currCores.has(cNum))return;
        const op=opCode(prev.num);
        if(sidingMatchesSouth(prev.num,southCores)||(op&&southOps.has(op)))return;

        const dst=prev.train["odpt:destinationStation"];
        const fromId=prev.train["odpt:fromStation"],toId=prev.train["odpt:toStation"];
        const nearSenga=fromId===SENGA_ID||toId===SENGA_ID||fromId===P+"Mita";
        const nearAsakusa=fromId===ASAKUSABASHI_ID||toId===ASAKUSABASHI_ID||fromId===P+"HigashiNihombashi";

        if(hasSt(dst,"Sengakuji")&&nearSenga){
          if(!sidings.sengakuji.some(x=>coreNum(x.origNum)===cNum)){
            sidings.sengakuji.push({id:"s_"+now+"_"+cNum,origNum:prev.num,expNum:pickExpectedNum(prev.num),train:prev.train,enteredAt:now});
          }
        }else if(hasSt(dst,"Asakusabashi")&&nearAsakusa){
          if(!sidings.asakusabashi.some(x=>coreNum(x.origNum)===cNum)){
            sidings.asakusabashi.push({id:"a_"+now+"_"+cNum,origNum:prev.num,expNum:pickExpectedNum(prev.num),train:prev.train,enteredAt:now});
          }
        }
      });
    }

    prevTrainMap.clear();
    currTrains.forEach(t=>{const num=t["odpt:trainNumber"]||"";if(num)prevTrainMap.set(coreNum(num),{num,train:t})});
    hasPrevSnap=true;
    saveSidings();
  }

  function activeSengaPreTrains(currTrains){
    if(!sengaOrigins.length)return[];
    const nowM=nowSvcMin();
    const activeNums=new Set(),activeSengaOps=new Set();
    currTrains.forEach(t=>{
      const num=t["odpt:trainNumber"]||"";
      if(num)activeNums.add(coreNum(num));
      if(dirOf(t)==="south"&&(t["odpt:fromStation"]===SENGA_ID||t["odpt:fromStation"]===P+"Takanawadai"||t["odpt:fromStation"]===P+"NishiMagome")){
        const op=opCode(num);if(op)activeSengaOps.add(op);
      }
    });
    return sengaOrigins.filter(x=>{
      if(nowM<x.depMin-5||nowM>x.depMin+1)return false;
      if(activeNums.has(coreNum(x.num)))return false;
      const op=opCode(x.num);if(op&&activeSengaOps.has(op))return false;
      return true;
    });
  }

    const u=manLay!==null?manLay:(window.innerWidth>=740);

  function badge(t,dir,run,trk,stId){
    const tp=trType(t["odpt:trainType"]),dst=fmtDest(t["odpt:destinationStation"]),num=t["odpt:trainNumber"]||"---",dm=dlyMin(t["odpt:delay"]),toei=isToei(t);
    let etaHtml="";
    if(!run&&stId===NISHI_ID){
      const dep=stDeparture(t,"nishi",dir);
      if(dep)etaHtml=`<span class="dep-eta">西${esc(dep.time)}発</span>`;
    }else if(!run&&stId===OSHI_ID){
      const ni=nextNishi(t),dep=stDeparture(t,"oshi",dir);
      etaHtml=`<span class="eta-group">${dep?`<span class="dep-eta">押${esc(dep.time)}発</span>`:""}<span class="nishi-eta${ni.none?" none":""}">西 ${esc(ni.text)}</span></span>`;
    }else{
      const ni=nextNishi(t);
      etaHtml=`<span class="nishi-eta${ni.none?" none":""}">西 ${esc(ni.text)}</span>`;
    }
    const b=document.createElement("button");b.type="button";
    b.className=`train-badge ${run?"is-running":"is-stopped"} ${toei?"is-toei":"is-other"}`;
    b.innerHTML=`<div class="badge-row-top"><span class="train-type-chip ${esc(tp.c)}">${esc(tp.l)}</span><span class="train-num-badge">${esc(num)}</span></div>`+
      `<div class="badge-row-mid"><span class="dest-wrap"><span class="dir-arrow ${dir}">${dir==="north"?"↓":"↑"}</span><span class="dest-name">${esc(dst)}行</span></span>${etaHtml}</div>`+
      `<div class="badge-row-bottom"><div class="status-chips"><span class="state-label ${run?"running":""}">${run?"走行中":"停車中"}</span>${trk?`<span class="track-num-chip">${trk}番線</span>`:""}${toei?'<span class="toei-owner-chip">都営車</span>':""}</div>${dm>0?`<span class="delay-tag">+${dm}分</span>`:""}</div>`;
    b.addEventListener("click",()=>openMod(t,dir,run,trk,null,null,stId));
    return b;
  }

  function addSlots(el,items,dir,bays,guide,stId){

  function addSengaSouth(el,items,preList,guide){
    const g=document.createElement("div");g.className="bay-guide";g.textContent=guide;el.appendChild(g);
    const l1=[],l2=[];
    items.forEach(x=>{if(sengaTrack(x.t,"south")===1)l1.push(x);else l2.push(x)});

    const pre1=preList.filter(p=>p.targetTrack===1);
    const pre2=preList.filter(p=>p.targetTrack===2);
    const track2Busy=l2.length>0;

    if(l1.length)l1.forEach(x=>el.appendChild(badge(x.t,"south",false,1,SENGA_ID)));
    else if(pre1.length)pre1.forEach(p=>el.appendChild(preBadge(p,false)));
    else{const d=document.createElement("div");d.className="empty-bay-slot";d.textContent="1番線（空き）";el.appendChild(d)}

    const usedPre2=new Set(),sidingNodes=[];
    sidings.sengakuji.forEach(s=>{
      const sOp=opCode(s.origNum),cands=returnCands(s.origNum);
      const matchPre=pre2.find(p=>cands.includes(coreNum(p.num))||(sOp&&opCode(p.num)===sOp));
      if(matchPre){
        usedPre2.add(matchPre);
        if(track2Busy)sidingNodes.push(sidingBadge(s,"泉岳寺","sengakuji",matchPre,true));
      }else{
        sidingNodes.push(sidingBadge(s,"泉岳寺","sengakuji",null,false));
      }
    });

    const remainPre2=pre2.filter(p=>!usedPre2.has(p));

    if(track2Busy){
      l2.forEach(x=>el.appendChild(badge(x.t,"south",false,2,SENGA_ID)));
      remainPre2.forEach(p=>sidingNodes.push(preBadge(p,true)));
    }else if(pre2.length){
      pre2.forEach(p=>el.appendChild(preBadge(p,false)));
    }else{
      const d=document.createElement("div");d.className="empty-bay-slot";d.textContent="2番線（空き）";el.appendChild(d);
    }

    if(sidingNodes.length)sidingNodes.forEach(n=>el.appendChild(n));
    else{const d=document.createElement("div");d.className="empty-bay-slot siding";d.textContent="引き上げ線（空き）";el.appendChild(d)}
  }

  }

  function render(trains){
    const stSl=ST.map(()=>({north:[],south:[]})),sgSl=Array.from({length:ST.length-1},()=>({north:[],south:[]}));
    let cnt=0;
    trains.forEach(t=>{
      const fi=IDX.get(t["odpt:fromStation"]),tid=t["odpt:toStation"],ti=tid?IDX.get(tid):undefined,dir=dirOf(t);
      if(!tid){if(fi!==undefined){stSl[fi][dir].push({t});cnt++}}
      else if(fi!==undefined&&ti!==undefined){const u=Math.min(fi,ti),l=Math.max(fi,ti);sgSl[l-u===1?u:Math.min(fi,sgSl.length-1)][dir].push({t});cnt++}
      else if(fi!==undefined){sgSl[dir==="north"?Math.min(fi,sgSl.length-1):Math.max(0,fi-1)][dir].push({t});cnt++}
      else if(ti!==undefined){sgSl[dir==="south"?Math.min(ti,sgSl.length-1):Math.max(0,ti-1)][dir].push({t});cnt++}
    });
    cntEl.textContent=`${cnt}本`;
    empEl.innerHTML=trains.length===0?'<div class="empty-state-card"><div class="empty-state-title">現在運行中の列車はありません</div><p class="empty-state-desc">深夜帯・営業時間外、または現在都営浅草線内の在線データがありません。</p></div>':"";
    const sengaPre=activeSengaPreTrains(trains);

    const frag=document.createDocumentFragment();
    COLS.forEach(c=>{
      const col=document.createElement("div");col.className="route-column";
      const ch=document.createElement("div");ch.className="col-header";
      ch.innerHTML=`<span class="dir-south">↑ 西馬込方面</span><span class="col-header-center">${esc(c.top)}</span><span class="dir-north">↓ 押上方面</span>`;
      col.appendChild(ch);
      for(let i=c.start;i<=c.end;i++){
        const s=ST[i],sr=document.createElement("div");
        sr.className=`station-row${i===0?" first-station":""}${i===ST.length-1?" last-station":""}${s.isDouble||s.id===ASAKUSABASHI_ID?" is-double-track":""}`;
        const lc=document.createElement("div");lc.className="track-col left";
        if(s.id===SENGA_ID)addSengaSouth(lc,stSl[i].south,sengaPre,s.lg);
        else if(s.id===ASAKUSABASHI_ID)addAsakusaSouth(lc,stSl[i].south,s.lg);
        else if(s.isDouble)addSlots(lc,stSl[i].south,"south",s.lb,s.lg,s.id);
        else stSl[i].south.forEach(x=>lc.appendChild(badge(x.t,"south",false,null,s.id)));

        const cc=document.createElement("div");cc.className="center-col";
        cc.innerHTML=`<div class="station-node"><span class="st-name${s.name.length>=5?" is-long":""}">${esc(s.name)}</span>${s.note?`<div class="st-note">${esc(s.note)}</div>`:""}</div>`;

        const rc=document.createElement("div");rc.className="track-col right";
        if(s.id===SENGA_ID)addSengaNorth(rc,stSl[i].north,s.rg);
        else if(s.isDouble)addSlots(rc,stSl[i].north,"north",s.rb,s.rg,s.id);
        else stSl[i].north.forEach(x=>rc.appendChild(badge(x.t,"north",false,null,s.id)));

        sr.append(lc,cc,rc);col.appendChild(sr);
        if(i<ST.length-1){
          const sg=sgSl[i],has=sg.south.length>0||sg.north.length>0;
          const sgr=document.createElement("div");sgr.className=`segment-row${has?" has-trains":""}${i===c.end&&c.tail?" col-tail-segment":""}`;
          const sl=document.createElement("div");sl.className="track-col left";sg.south.forEach(x=>sl.appendChild(badge(x.t,"south",true,null,null)));
          const sc=document.createElement("div");sc.className="center-col";sc.innerHTML='<span class="segment-dot"></span>';
          const sr2=document.createElement("div");sr2.className="track-col right";sg.north.forEach(x=>sr2.appendChild(badge(x.t,"north",true,null,null)));
          sgr.append(sl,sc,sr2);col.appendChild(sgr);
        }
      }
      const cf=document.createElement("div");cf.className="col-continue-badge";cf.textContent=c.bot;col.appendChild(cf);
      frag.appendChild(col);
    });
    mapEl.innerHTML="";mapEl.appendChild(frag);
  }

  function openMod(t,dir,run,trk,sidingInfo,preInfo,stId){
    const tp=trType(t["odpt:trainType"]),dst=fmtDest(t["odpt:destinationStation"]),num=t["odpt:trainNumber"]||"不明",own=ownerLbl(t),toei=isToei(t),
          ds=typeof t["odpt:delay"]==="number"?t["odpt:delay"]:0,dm=dlyMin(ds),
          fn=OBJ.get(t["odpt:fromStation"])?.name||trSt(t["odpt:fromStation"]),
          tn=t["odpt:toStation"]?(OBJ.get(t["odpt:toStation"])?.name||trSt(t["odpt:toStation"])):null;
    let loc=run&&tn?`${fn} → ${tn} 走行中`:`${fn}駅 停車中${trk?`（${trk}番線）`:""}`;
    if(sidingInfo)loc=`${sidingInfo.stName}駅 引き上げ線（${preInfo?`2番線空次第入線 ${preInfo.depTime}発`:"折返待"}）`;
    else if(preInfo)loc=`泉岳寺駅 ${trk?trk+"番線":"引き上げ線（2番線待）"}（始発予定 ${preInfo.depTime}発）`;

    const dtxt=dir==="north"?"押上方面（北行 ↓）":"西馬込・泉岳寺方面（南行 ↑）",
          dltxt=dm>0?`+${dm}分（約${ds}秒遅れ）`:"定時（遅れなし）",
          orig=originOf(t),origTxt=orig?fmtDest(orig):"不明",ni=nextNishi(t),
          niTxt=ni.none?"本日の直近到着なし（-）":(coreNum(ni.train)===coreNum(num)?`${ni.text}（この列車）`:`${ni.text}（${ni.train}として）`);
    let dt="---";if(t["dc:date"]){const d=new Date(t["dc:date"]);if(!isNaN(d.getTime()))dt=fmtTime(d)}

    modTit.innerHTML=`<span class="train-type-chip ${esc(tp.c)}" style="font-size:12px;padding:2px 8px">${esc(tp.l)}</span><span>${esc(dst)}行</span>`;
    const rows=[
      ["列車番号",`<span class="train-num-badge" style="font-size:12px">${esc(num)}</span>`,""],
      ["始発駅",esc(origTxt),""],["直近 西馬込着",esc(niTxt),""]
    ];
    if(!run&&stId===NISHI_ID){
      const dep=stDeparture(t,"nishi",dir);
      if(dep)rows.push(["西馬込 発車予定",esc(`${dep.time}（${dep.train}）`),""]);
    }else if(!run&&stId===OSHI_ID){
      const dep=stDeparture(t,"oshi",dir);
      if(dep)rows.push(["押上 発車予定",esc(`${dep.time}（${dep.train}）`),""]);
    }
    rows.push(["車両所属",`<span class="owner-pill${toei?" toei":""}">${esc(own)}</span>`,""]);
    rows.push(["現在位置",esc(loc),""],["進行方向",esc(dtxt),""]);
    if(sidingInfo){
      rows.push(["入線時刻",esc(fmtTime(new Date(sidingInfo.siding.enteredAt))),""]);
      rows.push(["予定折返番号",esc(returnCands(sidingInfo.siding.origNum).join(" / ")||sidingInfo.siding.expNum),""]);
    }else if(!preInfo){
      rows.push(["遅延状況",esc(dltxt),dm>0?"delay-highlight":""]);
      rows.push(["データ時刻",esc(dt),""]);
    }
    modList.innerHTML=rows.map(([k,v,c])=>`<li class="detail-item"><span class="detail-label">${esc(k)}</span><span class="detail-value ${c}">${v}</span></li>`).join("");

    modAct.innerHTML="";
    if(sidingInfo){
      const cb=document.createElement("button");cb.type="button";cb.className="siding-clear-btn";
      cb.textContent="この列車を引き上げ線表示から削除";
      cb.addEventListener("click",()=>{
        sidings[sidingInfo.stKey]=sidings[sidingInfo.stKey].filter(x=>x.id!==sidingInfo.siding.id);
        saveSidings();modEl.classList.remove("open");render(lastTrains);
      });
      modAct.appendChild(cb);
    }
    modEl.classList.add("open");
  }

  async function ensureTT(){
    if(ttReady||ttLoading)return;
    const ok=await loadTT(guessCal());
    if(ok&&lastTrains.length)render(lastTrains);
  }

  async function load(){
    if(fetching)return;fetching=true;refBtn.disabled=true;refBtn.classList.add("is-loading");
    try{
      const r=await fetch(API,{headers:{Accept:"application/json"},cache:"no-store"});
      if(!r.ok)throw new Error("HTTP "+r.status);
      const d=await r.json();if(!Array.isArray(d))throw new Error("Bad JSON");
      banEl.className="status-banner";banMsg.textContent="";
      updateSidings(d);
      lastTrains=d;render(d);lastOk=new Date();updEl.textContent=`最終更新 ${fmtTime(lastOk)}`;
      if(!ttReady)ensureTT();
    }catch(e){
      banEl.className="status-banner error";banMsg.textContent="運行データの取得に失敗しました。";retBtn.style.display="inline-block";
      if(!lastOk){updEl.textContent="取得エラー";render([])}
    }finally{
      fetching=false;refBtn.disabled=false;refBtn.classList.remove("is-loading");
      leftSec=SEC;cdEl.textContent=autoOn?`自動 ${leftSec}s`:"自動 OFF";
    }
  }

  refBtn.addEventListener("click",load);retBtn.addEventListener("click",load);
  autoTg.addEventListener("change",e=>{autoOn=e.target.checked;leftSec=SEC;cdEl.textContent=autoOn?`自動 ${leftSec}s`:"自動 OFF"});
  modCls.addEventListener("click",()=>modEl.classList.remove("open"));
  modEl.addEventListener("click",e=>{if(e.target===modEl)modEl.classList.remove("open")});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")modEl.classList.remove("open")});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&autoOn&&(!lastOk||Date.now()-lastOk.getTime()>SEC*1000))load()});
  setInterval(()=>{if(!autoOn||fetching)return;if(--leftSec<=0)load();else cdEl.textContent=`自動 ${leftSec}s`},1000);

  applyLay();render([]);
  load().then(()=>ensureTT());
})();
</script>
