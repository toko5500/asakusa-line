<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>都営浅草線 リアルタイム在線位置</title>
<style>
:root{--bg:#131314;--hd:rgba(24,25,27,.94);--sf:#1E1F20;--cd:#28292C;--cdt:#2F1E28;--bd:#3C4043;--bds:#5F6368;--tx:#E8EAED;--txs:#9AA0A6;--txm:#80868B;--rose:#E85298;--roseb:#F472B6;--rosed:#BE185D;--glow:rgba(232,82,152,.35);--red:#F87171;--rbg:rgba(220,38,38,.2);--rbd:rgba(248,113,113,.5);--cyan:#67E8F9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased;color-scheme:dark}
.app-header{position:sticky;top:0;z-index:50;background:var(--hd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top)}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;gap:6px}
.title-group{display:flex;align-items:center;gap:8px;min-width:0}
.line-symbol{width:26px;height:26px;border-radius:50%;border:3px solid var(--rose);background:var(--sf);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
.title-texts{min-width:0}
.app-title{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
.train-count-pill{font-size:10.5px;font-weight:700;background:rgba(232,82,152,.18);color:var(--roseb);border:1px solid rgba(232,82,152,.45);padding:1px 6px;border-radius:999px}
.last-updated{font-size:10.5px;color:var(--txs);margin-top:1px;font-variant-numeric:tabular-nums}
.header-inline-legend{display:none}
.header-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.layout-btn{appearance:none;border:1px solid var(--bds);background:var(--cd);color:var(--tx);font-size:11px;font-weight:700;padding:6px 8px;min-height:34px;border-radius:8px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.auto-toggle{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;user-select:none}
.toggle-label-text{font-size:9px;font-weight:600;color:var(--txs);font-variant-numeric:tabular-nums}
.toggle-switch{position:relative;width:38px;height:20px;background:#3C4043;border-radius:999px;transition:background-color .2s}
.toggle-switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--tx);border-radius:50%;transition:transform .2s}
.auto-toggle input{position:absolute;opacity:0;width:0;height:0}
.auto-toggle input:checked+.toggle-switch{background:var(--rose)}
.auto-toggle input:checked+.toggle-switch::after{transform:translateX(18px);background:#fff}
.refresh-btn{appearance:none;border:none;background:var(--rose);color:#fff;font-size:12px;font-weight:700;padding:7px 10px;min-height:34px;border-radius:9px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;box-shadow:0 2px 8px var(--glow);touch-action:manipulation}
.refresh-btn:active{transform:scale(.96);background:var(--rosed)}
.refresh-btn:disabled{opacity:.65}
.refresh-icon{width:13px;height:13px}
.is-loading .refresh-icon{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.direction-bar{display:grid;grid-template-columns:1fr 82px 1fr;align-items:center;background:var(--sf);border-top:1px solid var(--bd);padding:5px 4px;font-size:11px;font-weight:700;text-align:center}
.dir-south{color:#8AB4F8}.dir-center{color:var(--roseb);font-size:10px}.dir-north{color:var(--roseb)}
.status-banner{margin:10px 10px 0;padding:10px 12px;border-radius:12px;font-size:13px;display:none;align-items:center;justify-content:space-between;gap:10px}
.status-banner.error{display:flex;background:rgba(220,38,38,.16);border:1px solid var(--rbd);color:#FCA5A5}
.retry-link{background:#EF4444;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
.main-container{max-width:640px;margin:0 auto;padding:6px 4px 24px}
.route-cap{display:flex;justify-content:center;padding:6px 0}
.route-cap-badge{font-size:11px;font-weight:700;color:var(--txs);background:var(--sf);border:1px solid var(--bd);padding:3px 12px;border-radius:999px}
.route-map{position:relative;display:flex;flex-direction:column}
.route-column{display:contents}
.col-header,.col-continue-badge{display:none}
.station-row,.segment-row{display:grid;grid-template-columns:1fr 82px 1fr;align-items:stretch;position:relative}
.station-row{min-height:52px}.station-row.is-double-track{min-height:78px;padding:3px 0}
.segment-row{min-height:20px}.segment-row.has-trains{min-height:58px;padding:4px 0}
.track-col{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:3px 4px;min-width:0}
.track-col.left{align-items:flex-end}.track-col.right{align-items:flex-start}
.bay-guide{font-size:8.5px;font-weight:700;color:var(--txs);line-height:1;padding:0 2px;opacity:.85}
.empty-bay-slot{width:100%;height:22px;border:1px dashed var(--bd);border-radius:7px;background:rgba(30,31,32,.5);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;color:#747980}
.center-col{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.center-col::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:6px;transform:translateX(-50%);background:var(--rose);z-index:1}
.station-row.first-station .center-col::before{top:50%}
.station-row.last-station .center-col::before{bottom:50%}
.station-row.is-double-track .center-col::after{content:"";position:absolute;top:4px;bottom:4px;left:50%;width:24px;transform:translateX(-50%);border-left:2.5px solid var(--rose);border-right:2.5px solid var(--rose);border-radius:8px;opacity:.7;z-index:1;pointer-events:none}
.station-row.first-station.is-double-track .center-col::after{top:50%}
.station-row.last-station.is-double-track .center-col::after{bottom:50%}
.station-node{position:relative;z-index:2;background:var(--sf);border:2px solid var(--rose);border-radius:10px;padding:5px 4px;width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.station-row.is-double-track .station-node{border-width:2.5px;box-shadow:0 0 10px rgba(232,82,152,.25)}
.st-name{font-size:12px;font-weight:700;color:var(--tx);text-align:center;white-space:nowrap;letter-spacing:-.02em}
.st-name.is-long{font-size:11px;letter-spacing:-.04em}
.st-note{font-size:8px;font-weight:700;color:var(--roseb);margin-top:2px;line-height:1.1;text-align:center}
.segment-dot{position:relative;z-index:2;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2.5px solid var(--rose);opacity:0}
.segment-row.has-trains .segment-dot{opacity:1}
.train-badge{appearance:none;text-align:left;font-family:inherit;width:100%;background:var(--cd);border:1.5px solid var(--bds);border-radius:10px;padding:5px 7px;box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer;display:flex;flex-direction:column;gap:3px;position:relative;touch-action:manipulation}
.train-badge:active{transform:scale(.97)}
.train-badge.is-stopped{border-style:solid}.train-badge.is-running{border-style:dashed}
.train-badge.is-other{border-color:#6E747C}.train-badge.is-other.is-running{border-color:var(--txs)}
.train-badge.is-toei{background:var(--cdt);border-width:2.5px;border-color:var(--rose);box-shadow:0 0 0 1px rgba(232,82,152,.28),0 0 12px var(--glow)}
.track-col.left .train-badge::after,.track-col.right .train-badge::before{content:"";position:absolute;top:50%;width:5px;height:2px;background:#6E747C}
.track-col.left .train-badge.is-toei::after,.track-col.right .train-badge.is-toei::before{background:var(--rose);height:2.5px}
.track-col.left .train-badge::after{right:-6px}.track-col.right .train-badge::before{left:-6px}
.badge-row-top{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.train-type-chip{font-size:10px;font-weight:800;color:#fff;padding:1.5px 5px;border-radius:4px;white-space:nowrap;line-height:1.2}
.train-num-badge{font-size:10.5px;font-weight:900;color:#000;background:#E8EAED;border:1px solid #000;padding:.5px 5px;border-radius:4px;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.type-local{background:#4B5563}.type-express{background:#2563EB}.type-limited{background:#DC2626}.type-rapid{background:#16A34A}
.type-airport{background:#EA580C}.type-access{background:#9333EA}.type-commuter{background:#D97706}.type-liner{background:#0F172A;border:1px solid #64748B}.type-unknown{background:#5F6368}
.badge-row-mid{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;font-size:12px;font-weight:700;color:var(--tx);line-height:1.25}
.dest-wrap{display:flex;align-items:flex-start;gap:2px;min-width:0}
.dir-arrow{font-size:11.5px;font-weight:900;flex-shrink:0;margin-top:1px}
.dir-arrow.north{color:var(--roseb)}.dir-arrow.south{color:#8AB4F8}
.dest-name{white-space:normal;word-break:break-word}
.nishi-eta{font-size:10px;font-weight:800;color:var(--cyan);background:rgba(103,232,249,.12);border:1px solid rgba(103,232,249,.35);padding:1px 4px;border-radius:4px;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.nishi-eta.none{color:var(--txm);background:rgba(128,134,139,.12);border-color:rgba(128,134,139,.3)}
.badge-row-bottom{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:9.5px;color:var(--txs)}
.status-chips{display:flex;align-items:center;gap:4px}
.state-label{font-weight:600}.state-label.running{color:var(--roseb)}
.toei-owner-chip{font-size:9px;font-weight:800;color:var(--roseb);background:rgba(232,82,152,.18);padding:0 4px;border-radius:3px}
.track-num-chip{font-size:9px;font-weight:800;color:#E8EAED;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:0 4px;border-radius:3px}
.delay-tag{font-size:10px;font-weight:800;color:var(--red);background:var(--rbg);border:1px solid var(--rbd);padding:0 4px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty-state-card{margin:12px 6px;padding:18px 16px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;text-align:center;color:var(--txs)}
.empty-state-title{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:6px}
.empty-state-desc{font-size:12.5px;margin:0}
.legend-box{margin:16px 4px 8px;padding:10px 12px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;font-size:11px;color:var(--txs);display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-sample-stop{width:15px;height:11px;border:1.5px solid var(--txs);border-radius:3px;background:var(--cd)}
.legend-sample-run{width:15px;height:11px;border:1.5px dashed var(--txs);border-radius:3px;background:var(--cd)}
.legend-sample-toei{width:15px;height:11px;border:2px solid var(--rose);border-radius:3px;background:var(--cdt);box-shadow:0 0 6px var(--glow)}
.app-footer{max-width:640px;margin:0 auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));font-size:10.5px;color:var(--txm);line-height:1.5;text-align:center}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.modal-backdrop.open{display:flex}
@media(min-width:520px){.modal-backdrop{align-items:center}}
.modal-sheet{width:100%;max-width:440px;background:var(--sf);border:1px solid var(--bd);border-radius:18px;box-shadow:0 12px 32px rgba(0,0,0,.65);overflow:hidden}
.modal-header{background:var(--rose);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.modal-title{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.modal-close{appearance:none;border:none;background:rgba(0,0,0,.25);color:#fff;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:14px 16px 18px}
.detail-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.detail-item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--bd);font-size:13.5px}
.detail-item:last-child{border-bottom:none;padding-bottom:0}
.detail-label{color:var(--txs);font-weight:600;flex-shrink:0}
.detail-value{color:var(--tx);font-weight:700;text-align:right;word-break:break-word}
.detail-value.delay-highlight{color:var(--red)}
.owner-pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;background:var(--cd);border:1px solid var(--bd)}
.owner-pill.toei{border-color:var(--rose);color:var(--roseb);background:rgba(232,82,152,.15)}

body.is-3col{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body.is-3col .app-header{position:static;flex-shrink:0}
body.is-3col .header-top{padding:5px 12px}
body.is-3col .direction-bar,body.is-3col .route-cap,body.is-3col .legend-box{display:none}
body.is-3col .header-inline-legend{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--txs)}
body.is-3col .main-container{max-width:none;width:100%;flex:1;min-height:0;padding:5px 6px 3px;display:flex;flex-direction:column}
body.is-3col .empty-state-card{margin:0 0 6px;padding:8px 12px}
body.is-3col .route-map{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
body.is-3col .route-column{display:flex;flex-direction:column;justify-content:space-between;background:rgba(30,31,32,.45);border:1px solid #2A2B2E;border-radius:10px;padding:3px 3px 4px;min-height:0;overflow-y:auto}
body.is-3col .col-header{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;text-align:center;font-size:9.5px;font-weight:700;padding:2px 2px 3px;border-bottom:1px solid #2D2E32;margin-bottom:2px;flex-shrink:0}
body.is-3col .col-header-center{color:var(--txs);font-size:9px}
body.is-3col .col-continue-badge{display:flex;justify-content:center;font-size:8.5px;font-weight:700;color:var(--txm);padding:1px 0;flex-shrink:0}
body.is-3col .station-row,body.is-3col .segment-row{grid-template-columns:1fr 64px 1fr}
body.is-3col .station-row{min-height:32px}
body.is-3col .station-row.is-double-track{min-height:48px;padding:1px 0}
body.is-3col .segment-row{min-height:6px}
body.is-3col .segment-row.has-trains{min-height:38px;padding:2px 0}
body.is-3col .route-column .segment-row.col-tail-segment:not(.has-trains){display:none}
body.is-3col .track-col{padding:1px 2px;gap:2px}
body.is-3col .bay-guide{font-size:7.5px}
body.is-3col .station-node{width:60px;padding:2px;border-radius:7px}
body.is-3col .st-name{font-size:10.5px}
body.is-3col .st-name.is-long{font-size:9px}
body.is-3col .st-note{font-size:7px;margin-top:1px}
body.is-3col .empty-bay-slot{height:16px;font-size:8px;border-radius:5px}
body.is-3col .train-badge{padding:2.5px 4px;gap:1.5px;border-radius:6px}
body.is-3col .badge-row-top{gap:2.5px}
body.is-3col .train-type-chip{font-size:8.5px;padding:1px 3.5px}
body.is-3col .train-num-badge{font-size:9px;padding:0 3.5px}
body.is-3col .badge-row-mid{font-size:10.5px;line-height:1.15}
body.is-3col .dir-arrow{font-size:10px}
body.is-3col .nishi-eta{font-size:8.5px;padding:0 3px}
body.is-3col .badge-row-bottom{font-size:8px}
body.is-3col .toei-owner-chip,body.is-3col .track-num-chip{font-size:7.5px}
body.is-3col .delay-tag{font-size:8.5px}
body.is-3col .app-footer{max-width:none;width:100%;flex-shrink:0;padding:2px 12px calc(3px + env(safe-area-inset-bottom));font-size:9px;display:flex;justify-content:center;gap:12px;white-space:nowrap;overflow:hidden}
body.is-3col .app-footer p{margin:0!important;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-top">
    <div class="title-group">
      <div class="line-symbol">A</div>
      <div class="title-texts">
        <h1 class="app-title">都営浅草線 <span class="train-count-pill" id="trainCountPill">-- 列車</span></h1>
        <div class="last-updated" id="lastUpdated">取得中...</div>
      </div>
    </div>
    <div class="header-inline-legend">
      <div class="legend-item"><span class="legend-sample-stop"></span><span>停車</span></div>
      <div class="legend-item"><span class="legend-sample-run"></span><span>走行</span></div>
      <div class="legend-item"><span class="legend-sample-toei"></span><span>都営車</span></div>
      <div class="legend-item"><span style="color:var(--cyan);font-weight:700">西 HH:MM</span><span>直近西馬込着</span></div>
    </div>
    <div class="header-controls">
      <button type="button" class="layout-btn" id="layoutToggleBtn">3列表示</button>
      <label class="auto-toggle"><input type="checkbox" id="autoRefreshToggle" checked><span class="toggle-switch"></span><span class="toggle-label-text" id="countdownText">自動 45s</span></label>
      <button type="button" class="refresh-btn" id="manualRefreshBtn">
        <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        <span>更新</span>
      </button>
    </div>
  </div>
  <div class="direction-bar">
    <div class="dir-south">↑ 西馬込・泉岳寺方面</div>
    <div class="dir-center">駅・路線</div>
    <div class="dir-north">↓ 押上・京成方面</div>
  </div>
</header>
<div id="statusBanner" class="status-banner" role="alert"><span id="statusBannerMsg"></span><button type="button" class="retry-link" id="retryBtn">再試行</button></div>
<main class="main-container">
  <div id="emptyStateContainer"></div>
  <div class="route-cap"><span class="route-cap-badge">▲ 西馬込（始点）</span></div>
  <div id="routeMap" class="route-map"></div>
  <div class="route-cap"><span class="route-cap-badge">▼ 京成押上線・北総線 直通方面</span></div>
  <div class="legend-box">
    <div class="legend-item"><span class="legend-sample-stop"></span><span>停車（実線）</span></div>
    <div class="legend-item"><span class="legend-sample-run"></span><span>走行（点線）</span></div>
    <div class="legend-item"><span class="legend-sample-toei"></span><span>都営車（ローズ枠）</span></div>
    <div class="legend-item"><span style="color:var(--cyan);font-weight:700">西 HH:MM</span><span>直近西馬込着（- はなし）</span></div>
  </div>
</main>
<footer class="app-footer">
  <p style="margin:0 0 4px">出典：公共交通オープンデータセンター（ODPT）提供データ（東京都交通局）</p>
  <p style="margin:0">※押上・西馬込の着番線は非公開のため枠表示は目安です。事業者への直接のお問い合わせはご遠慮ください。</p>
</footer>
<div id="trainModal" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal-sheet">
    <div class="modal-header"><h2 class="modal-title" id="modalTitle">列車詳細</h2><button type="button" class="modal-close" id="modalCloseBtn">×</button></div>
    <div class="modal-body"><ul class="detail-list" id="modalDetailList"></ul></div>
  </div>
</div>
<script>
(function(){
  "use strict";
  const API="https://api-public.odpt.org/api/v4/odpt:Train?odpt:operator=odpt.Operator:Toei&odpt:railway=odpt.Railway:Toei.Asakusa";
  const TT_BASE="https://api-public.odpt.org/api/v4/odpt:TrainTimetable?odpt:operator=odpt.Operator:Toei&odpt:railway=odpt.Railway:Toei.Asakusa&odpt:calendar=odpt.Calendar:";

  function guessCal(){
    const d=new Date(),w=d.getDay(),m=d.getMonth()+1,dt=d.getDate(),y=d.getFullYear();

  async function loadTT(cal){
    try{
      const r=await fetch(TT_BASE+cal,{headers:{Accept:"application/json"}});
      if(!r.ok)return false;
      const arr=await r.json();if(!Array.isArray(arr))return false;
      ttByNum.clear();nishiByOp.clear();
      arr.forEach(tt=>{
        const num=tt["odpt:trainNumber"];if(!num)return;
        const objs=Array.isArray(tt["odpt:trainTimetableObject"])?tt["odpt:trainTimetableObject"]:[];
        const orig=tt["odpt:originStation"]||(objs[0]&&objs[0]["odpt:departureStation"]?[objs[0]["odpt:departureStation"]]:null);
        let na=null;
        for(const o of objs){if(o["odpt:arrivalStation"]===NISHI_ID&&o["odpt:arrivalTime"]){na=o["odpt:arrivalTime"];break}}
        ttByNum.set(num,{origin:orig,na,nm:toSvcMin(na)});
        if(na){const op=opCode(num);if(op){if(!nishiByOp.has(op))nishiByOp.set(op,[]);nishiByOp.get(op).push({num,time:na,min:toSvcMin(na)})}}
      });
      nishiByOp.forEach(l=>l.sort((a,b)=>a.min-b.min));
      ttReady=true;return true;
    }catch(e){return false}
  }

  function nextNishi(t){
    if(!ttReady)return{text:"...",train:null,none:true};
    const num=t["odpt:trainNumber"]||"",nowM=nowSvcMin(),cur=ttByNum.get(num);
    if(cur&&cur.na&&cur.nm>=nowM-45)return{text:cur.na,train:num,none:false};
    const op=opCode(num);
    if(op&&nishiByOp.has(op)){const hit=nishiByOp.get(op).find(x=>x.min>=nowM-3);if(hit)return{text:hit.time,train:hit.num,none:false}}
    return{text:"-",train:null,none:true};
  }

  function originOf(t){
    if(t["odpt:originStation"]&&t["odpt:originStation"].length)return t["odpt:originStation"];
    if(t["odpt:startingStation"]&&t["odpt:startingStation"].length)return t["odpt:startingStation"];
    const c=ttByNum.get(t["odpt:trainNumber"]||"");return c?c.origin:null;
  }

  // 泉岳寺の番線判定: 南行(西馬込行き=2番線, 京急方面行き=1番線) / 北行(西馬込始発=3番線, 京急線内始発=4番線)

    if(dir==="south")return hasNishi(t["odpt:destinationStation"])?2:1;
    return hasNishi(originOf(t))?3:4;
  }

  function dirOf(t){

    const fi=IDX.get(t["odpt:fromStation"]),ti=IDX.get(t["odpt:toStation"]);
    return(fi!==undefined&&ti!==undefined)?(ti>fi?"north":"south"):"north";
  }

  function addSlots(el,items,dir,bays,guide){

  }

  function addSengaSlots(el,items,dir,guide){
    const g=document.createElement("div");g.className="bay-guide";g.textContent=guide;el.appendChild(g);
    const tA=dir==="south"?1:3,tB=dir==="south"?2:4;
    const listA=[],listB=[];
    items.forEach(x=>{if(sengaTrack(x.t,dir)===tA)listA.push(x);else listB.push(x)});
    if(listA.length)listA.forEach(x=>el.appendChild(badge(x.t,dir,false,tA)));

  function render(trains){
    const stSl=ST.map(()=>({north:[],south:[]})),sgSl=Array.from({length:ST.length-1},()=>({north:[],south:[]}));

  async function load(){
    if(fetching)return;fetching=true;refBtn.disabled=true;refBtn.classList.add("is-loading");
    try{
      const r=await fetch(API,{headers:{Accept:"application/json"},cache:"no-store"});
      if(!r.ok)throw new Error("HTTP "+r.status);
      const d=await r.json();if(!Array.isArray(d))throw new Error("Bad JSON");
      banEl.className="status-banner";banMsg.textContent="";
      lastTrains=d;render(d);lastOk=new Date();updEl.textContent=`最終更新 ${fmtTime(lastOk)}`;
    }catch(e){
      banEl.className="status-banner error";banMsg.textContent="運行データの取得に失敗しました。";retBtn.style.display="inline-block";
      if(!lastOk){updEl.textContent="取得エラー";render([])}
    }finally{
      fetching=false;refBtn.disabled=false;refBtn.classList.remove("is-loading");
      leftSec=SEC;cdEl.textContent=autoOn?`自動 ${leftSec}s`:"自動 OFF";
    }
  }

  refBtn.addEventListener("click",load);retBtn.addEventListener("click",load);

  modCls.addEventListener("click",()=>modEl.classList.remove("open"));
  modEl.addEventListener("click",e=>{if(e.target===modEl)modEl.classList.remove("open")});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")modEl.classList.remove("open")});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&autoOn&&(!lastOk||Date.now()-lastOk.getTime()>SEC*1000))load()});
  setInterval(()=>{if(!autoOn||fetching)return;if(--leftSec<=0)load();else cdEl.textContent=`自動 ${leftSec}s`},1000);

  applyLay();render([]);load();
  loadTT(guessCal()).then(ok=>{if(ok&&lastTrains.length)render(lastTrains)});
})();
</script>
</body>
</html>
